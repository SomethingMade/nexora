<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survey</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#6b6b70;--line:#dcdce0;--soft:#f3f3f5;--err:#c62828;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0d;--ink:#f5f5f7;--mute:#9a9aa2;--line:#2a2a30;--soft:#17171b;--err:#ef6b6b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ink);transition:width .25s;z-index:9}
main{max-width:620px;margin:0 auto;padding:56px 20px 80px}
h1{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.intro{color:var(--mute);margin:0 0 36px}
fieldset{border:0;padding:0;margin:0 0 34px}
legend{font-weight:600;font-size:1.08rem;padding:0;margin-bottom:12px}
.req{color:var(--mute);font-weight:400;font-size:.85rem;margin-left:6px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ink);background:var(--soft)}
.opt input{accent-color:var(--ink);width:18px;height:18px;margin:0}
.rate{display:flex;gap:8px}
.rate label{flex:1;text-align:center;padding:14px 0;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600}
.rate input{position:absolute;opacity:0}
.rate label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rate label:has(input:focus-visible),.opt:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.ends{display:flex;justify-content:space-between;color:var(--mute);font-size:.82rem;margin-top:6px}
textarea,input[type=text]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:2px solid var(--ink);outline-offset:1px}
.err{color:var(--err);font-size:.88rem;margin-top:6px;display:none}
fieldset.bad .err{display:block}
fieldset.bad legend{color:var(--err)}
button{font:inherit;font-weight:600;width:100%;padding:15px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#msg{text-align:center;margin-top:14px;color:var(--mute);min-height:1.4em}
#done{display:none;text-align:center;padding-top:12vh}
@media(prefers-reduced-motion:reduce){#bar{transition:none}}
</style>
</head>
<body>
<div id="bar"></div>
<main>
  <form id="form" novalidate>
    <h1 id="title">Loading…</h1>
    <p class="intro" id="intro"></p>
    <div id="qs"></div>
    <div class="hp" aria-hidden="true"><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>
    <button type="submit" id="send" disabled>Send answers</button>
    <div id="msg" role="status"></div>
  </form>
  <section id="done">
    <h1>Thank you</h1>
    <p class="intro">Your answers have been sent.</p>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ---- Firebase config: same project as Haba (newstart-64c43) ---- */
const firebaseConfig = {
  apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
  authDomain: "newstart-64c43.firebaseapp.com",
  databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
  projectId: "newstart-64c43",
  storageBucket: "newstart-64c43.firebasestorage.app",
  messagingSenderId: "941619830061",
  appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
};

/* ---- New RTDB nodes (none of Haba's existing nodes are touched) ----
   surveys/{surveyId}                      survey definition (optional, overrides the default below)
   survey_responses/{surveyId}/{pushId}    one entry per submission
   survey_stats/{surveyId}/count           running total                                        */
const NODE = { defs: 'surveys', responses: 'survey_responses', stats: 'survey_stats' };

const SURVEY_ID = new URLSearchParams(location.search).get('s') || 'general';

const DEFAULT_SURVEY = {
  title: 'Tell us what you think',
  description: 'Takes about two minutes. Your answers help us improve.',
  questions: [
    { id: 'q1', type: 'rating', text: 'How easy was the app to use?', required: true, low: 'Hard', high: 'Easy' },
    { id: 'q2', type: 'choice', text: 'How often do you use it?', required: true, options: ['Daily', 'Weekly', 'Monthly', 'Rarely'] },
    { id: 'q3', type: 'multi', text: 'Which features do you use?', options: ['Chats', 'Feed', 'Live', 'Voice calls', 'Rides'] },
    { id: 'q4', type: 'text', text: 'What should we improve first?' }
  ]
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const $ = id => document.getElementById(id);
let survey = DEFAULT_SURVEY;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render() {
  document.title = survey.title;
  $('title').textContent = survey.title;
  $('intro').textContent = survey.description || '';
  $('qs').innerHTML = survey.questions.map(q => {
    const req = q.required ? '<span class="req">Required</span>' : '<span class="req">Optional</span>';
    let body = '';
    if (q.type === 'rating') {
      body = '<div class="rate">' + [1,2,3,4,5].map(n =>
        `<label>${n}<input type="radio" name="${q.id}" value="${n}"></label>`).join('') + '</div>' +
        `<div class="ends"><span>${esc(q.low || '')}</span><span>${esc(q.high || '')}</span></div>`;
    } else if (q.type === 'choice' || q.type === 'multi') {
      const t = q.type === 'choice' ? 'radio' : 'checkbox';
      body = (q.options || []).map(o =>
        `<label class="opt"><input type="${t}" name="${q.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('');
    } else {
      body = `<textarea name="${q.id}" maxlength="1000"></textarea>`;
    }
    return `<fieldset data-q="${q.id}"><legend>${esc(q.text)}${req}</legend>${body}<div class="err">Please answer this question.</div></fieldset>`;
  }).join('');
}

function collect() {
  const answers = {};
  survey.questions.forEach(q => {
    const f = document.querySelector(`[data-q="${q.id}"]`);
    let v = null;
    if (q.type === 'rating') { const c = f.querySelector('input:checked'); v = c ? Number(c.value) : null; }
    else if (q.type === 'choice') { const c = f.querySelector('input:checked'); v = c ? c.value : null; }
    else if (q.type === 'multi') { const c = [...f.querySelectorAll('input:checked')].map(i => i.value); v = c.length ? c : null; }
    else { const t = f.querySelector('textarea').value.trim(); v = t || null; }
    if (v !== null) answers[q.id] = v;
  });
  return answers;
}

function validate(answers) {
  let first = null;
  survey.questions.forEach(q => {
    const f = document.querySelector(`[data-q="${q.id}"]`);
    const bad = q.required && !(q.id in answers);
    f.classList.toggle('bad', bad);
    if (bad && !first) first = f;
  });
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return !first;
}

function progress() {
  const a = collect();
  $('bar').style.width = (Object.keys(a).length / survey.questions.length * 100) + '%';
}

async function load() {
  try { await firebase.auth().signInAnonymously(); } catch (e) { /* fine if rules allow unauthenticated writes */ }
  try {
    const snap = await db.ref(`${NODE.defs}/${SURVEY_ID}`).get();
    if (snap.exists() && snap.val().questions) {
      const v = snap.val();
      v.questions = Array.isArray(v.questions) ? v.questions.filter(Boolean) : Object.values(v.questions);
      survey = v;
    }
  } catch (e) { /* use the built-in survey */ }
  render();
  if (localStorage.getItem('survey_done_' + SURVEY_ID)) {
    $('msg').textContent = 'You have already answered this survey on this device.';
  } else {
    $('send').disabled = false;
  }
}

$('form').addEventListener('input', progress);
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if ($('hp').value) return; // bot trap
  const answers = collect();
  if (!validate(answers)) return;
  $('send').disabled = true;
  $('msg').textContent = 'Sending…';
  try {
    const user = firebase.auth().currentUser;
    await db.ref(`${NODE.responses}/${SURVEY_ID}`).push({
      answers,
      uid: user ? user.uid : null,
      submittedAt: firebase.database.ServerValue.TIMESTAMP
    });
    db.ref(`${NODE.stats}/${SURVEY_ID}/count`).transaction(n => (n || 0) + 1).catch(() => {});
    try { localStorage.setItem('survey_done_' + SURVEY_ID, '1'); } catch (_) {}
    $('form').style.display = 'none';
    $('done').style.display = 'block';
    $('bar').style.width = '100%';
  } catch (err) {
    $('send').disabled = false;
    $('msg').textContent = 'Could not send. Check your connection and try again.';
  }
});

load();
</script>
</body>
</html>
